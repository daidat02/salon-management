  github_com_daidat02_server_internal_domain_appointment.CancelRequest:
    properties:
      reason:
        type: string
    type: object
  github_com_daidat02_server_internal_domain_appointment.RescheduleRequest:
    properties:
      end_time:
        type: string
      start_time:
        type: string
    type: object
  github_com_daidat02_server_internal_domain_appointment.UpdateStatusRequest:
    properties:
      status:
        type: string
    type: object
  github_com_daidat02_server_internal_domain_category.CreateCategoryRequest:
    properties:
      description:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      type:
        type: string
    type: object
  github_com_daidat02_server_internal_domain_category.UpdateCategoryRequest:
    properties:
      description:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      type:
        type: string
    type: object
  github_com_daidat02_server_internal_domain_customer.CreateCustomerRequest:
    properties:
      birth_date:
        type: string
      full_name:
        type: string
      gender:
        type: string
      note:
        type: string
      phone:
        type: string
    type: object
  github_com_daidat02_server_internal_domain_customer.UpdateCustomerRequest:
    properties:
      birth_date:
        type: string
      full_name:
        type: string
      gender:
        type: string
      note:
        type: string
      phone:
        type: string
    type: object
  github_com_daidat02_server_internal_domain_inventory.CreateDocumentRequest:
    properties:
      created_by:
        type: string
      document_code:
        type: string
      items:
        items:
          $ref: '#/definitions/github_com_daidat02_server_internal_domain_inventory.DocumentItemInput'
        type: array
      note:
        type: string
      order_id:
        type: string
      reason:
        type: string
      supplier_id:
        type: string
      type:
        type: string
    type: object
  github_com_daidat02_server_internal_domain_inventory.DocumentItemInput:
    properties:
      product_id:
        type: string
      quantity:
        type: number
      unit:
        type: string
      unit_price:
        type: number
    type: object
  github_com_daidat02_server_internal_domain_order.CreateOrderRequest:
    properties:
      appointment_id:
        type: string
      customer_id:
        type: string
      discount_amount:
        type: number
      items:
        items:
          $ref: '#/definitions/github_com_daidat02_server_internal_domain_order.OrderItemInput'
        type: array
    type: object
  github_com_daidat02_server_internal_domain_order.CreatePaymentRequest:
    properties:
      amount:
        type: number
      method:
        type: string
      provider:
        type: string
      provider_txn_id:
        type: string
    type: object
  github_com_daidat02_server_internal_domain_order.ItemMaterialInput:
    properties:
      id:
        type: string
      order_item_id:
        type: string
      product_id:
        type: string
      quantity:
        type: number
      unit_cost_at_time:
        type: number
    type: object
  github_com_daidat02_server_internal_domain_order.OrderItemInput:
    properties:
      item_type:
        type: string
      materials:
        items:
          $ref: '#/definitions/github_com_daidat02_server_internal_domain_order.ItemMaterialInput'
        type: array
      product_id:
        type: string
      quantity:
        type: number
      service_id:
        type: string
      staff_id:
        type: string
    type: object
  github_com_daidat02_server_internal_domain_product.CreateProductRequest:
    properties:
      category_id:
        type: string
      cost_price:
        type: number
      is_active:
        type: boolean
      min_stock:
        type: number
      name:
        type: string
      net_amount:
        type: number
      net_unit:
        type: string
      product_type:
        type: string
      sell_price:
        type: number
      show_on_web:
        type: boolean
      sku:
        type: string
      stock_quantity:
        type: number
      unit:
        type: string
    type: object
  github_com_daidat02_server_internal_domain_product.UpdateProductRequest:
    properties:
      category_id:
        type: string
      cost_price:
        type: number
      is_active:
        type: boolean
      min_stock:
        type: number
      name:
        type: string
      net_amount:
        type: number
      net_unit:
        type: string
      product_type:
        type: string
      sell_price:
        type: number
      show_on_web:
        type: boolean
      sku:
        type: string
      stock_quantity:
        type: number
      unit:
        type: string
    type: object
  github_com_daidat02_server_internal_domain_service.CreateServiceRequest:
    properties:
      buffer_minutes:
        type: integer
      category_id:
        type: string
      description:
        type: string
      duration_minutes:
        type: integer
      is_active:
        type: boolean
      materials:
        items:
          $ref: '#/definitions/github_com_daidat02_server_internal_domain_service.ServiceMaterialInput'
        type: array
      name:
        type: string
      price:
        type: number
    type: object
  github_com_daidat02_server_internal_domain_service.ServiceMaterialInput:
    properties:
      product_id:
        type: string
