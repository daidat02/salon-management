    type: object
  github_com_daidat02_server_internal_domain_service.UpdateServiceRequest:
    properties:
      buffer_minutes:
        type: integer
      category_id:
        type: string
      description:
        type: string
      duration_minutes:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      price:
        type: number
    type: object
  github_com_daidat02_server_internal_domain_staff.CreateStaffRequest:
    properties:
      code:
        type: string
      commission_rate:
        type: number
      full_name:
        type: string
      hire_date:
        type: string
      id:
        type: string
      organization_id:
        type: string
      phone:
        type: string
      position:
        type: string
      status:
        type: string
    type: object
  github_com_daidat02_server_internal_domain_staff.UpdateStaffRequest:
    properties:
      code:
