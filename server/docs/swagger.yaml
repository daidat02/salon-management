          $ref: '#/definitions/github_com_daidat02_server_internal_domain_appointment.ApoimentItemInput'
        type: array
      note:
        type: string
      required_deposit_amount:
        type: number
      source:
        type: string
      staff_id:
        type: string
      start_time:
        type: string
      status:
        type: string
