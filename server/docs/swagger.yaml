  github_com_daidat02_server_internal_domain_user.LoginRequest:
    properties:
      password:
        type: string
      phone:
        type: string
    type: object
  github_com_daidat02_server_pkg_response.ErrorResponse:
    properties:
      code:
        type: integer
      error:
        type: string
      message:
        type: string
    type: object
  github_com_daidat02_server_pkg_response.SuccessResponse:
    properties:
      access_token:
        type: string
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
info:
  contact: {}
  description: 'API quản lý salon: user, nhân viên, khách hàng.'
  title: Salon Management API
  version: "1.0"
paths:
  /appointments:
    get:
      parameters:
      - description: Trang (mặc định 1)
        in: query
        name: page
        type: integer
      - description: Số dòng/trang (mặc định 20, tối đa 100)
        in: query
        name: page_size
        type: integer
      - description: Lọc trạng thái (pending|confirmed|...)
        in: query
        name: status
        type: string
      - description: Từ thời điểm (ISO8601, lọc start_time)
        in: query
        name: from
        type: string
      - description: Đến thời điểm (ISO8601, lọc start_time)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Danh sách lịch hẹn kèm phân trang
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.SuccessResponse'
        "400":
          description: Bộ lọc không hợp lệ
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.ErrorResponse'
        "401":
          description: Thiếu token / token không hợp lệ
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Lấy danh sách lịch hẹn (phân trang + lọc)
      tags:
      - Appointments
    post:
      consumes:
      - application/json
      parameters:
      - description: Thông tin lịch hẹn (total do server tính từ items)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_daidat02_server_internal_domain_appointment.AppointmentCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Tạo lịch hẹn thành công
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.SuccessResponse'
        "400":
          description: Dữ liệu không hợp lệ / thiếu organization
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.ErrorResponse'
        "401":
          description: Thiếu token / token không hợp lệ
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.ErrorResponse'
        "404":
          description: Service/product không thuộc tổ chức
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.ErrorResponse'
        "500":
          description: Lỗi server
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Tạo lịch hẹn (tự tìm/tạo khách theo phone)
      tags:
      - Appointments
  /appointments/{id}:
    delete:
      parameters:
      - description: ID lịch hẹn
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Xóa lịch hẹn thành công
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.SuccessResponse'
        "400":
          description: Trạng thái không cho xóa (hãy hủy lịch)
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.ErrorResponse'
        "401":
          description: Thiếu token / token không hợp lệ
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.ErrorResponse'
        "404":
          description: Không tìm thấy lịch hẹn
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Xóa cứng lịch hẹn (chỉ pending/cancelled)
      tags:
      - Appointments
    get:
      parameters:
      - description: ID lịch hẹn
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Chi tiết lịch hẹn
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.SuccessResponse'
        "400":
          description: Thiếu id
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.ErrorResponse'
        "401":
          description: Thiếu token / token không hợp lệ
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.ErrorResponse'
        "404":
          description: Không tìm thấy lịch hẹn
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Chi tiết lịch hẹn kèm items
      tags:
      - Appointments
  /appointments/{id}/cancel:
    post:
      consumes:
      - application/json
      parameters:
      - description: ID lịch hẹn
        in: path
        name: id
        required: true
        type: string
      - description: Lý do hủy
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_daidat02_server_internal_domain_appointment.CancelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Hủy lịch thành công
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.SuccessResponse'
        "400":
          description: Trạng thái không cho hủy
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.ErrorResponse'
        "401":
          description: Thiếu token / token không hợp lệ
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.ErrorResponse'
        "404":
          description: Không tìm thấy lịch hẹn
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Hủy lịch hẹn (chỉ pending/confirmed)
      tags:
      - Appointments
  /appointments/{id}/reschedule:
    put:
      consumes:
      - application/json
      parameters:
      - description: ID lịch hẹn
        in: path
        name: id
        required: true
        type: string
      - description: Giờ mới (ISO8601)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_daidat02_server_internal_domain_appointment.RescheduleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Đổi lịch thành công
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.SuccessResponse'
        "400":
          description: Giờ invalid / trạng thái không cho đổi
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.ErrorResponse'
        "401":
          description: Thiếu token / token không hợp lệ
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.ErrorResponse'
        "404":
          description: Không tìm thấy lịch hẹn
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Đổi lịch hẹn (chỉ pending/confirmed)
      tags:
      - Appointments
  /appointments/{id}/status:
    patch:
      consumes:
      - application/json
      parameters:
      - description: ID lịch hẹn
        in: path
        name: id
        required: true
        type: string
      - description: Trạng thái mới
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_daidat02_server_internal_domain_appointment.UpdateStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Cập nhật trạng thái thành công
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.SuccessResponse'
        "400":
          description: Chuyển đổi không hợp lệ
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.ErrorResponse'
        "401":
          description: Thiếu token / token không hợp lệ
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.ErrorResponse'
        "404":
          description: Không tìm thấy lịch hẹn
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Chuyển trạng thái lịch hẹn (theo state machine)
      tags:
      - Appointments
  /categories:
    get:
      parameters:
      - description: Trang (mặc định 1)
        in: query
        name: page
        type: integer
      - description: Số dòng/trang (mặc định 20, tối đa 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Danh sách danh mục kèm phân trang
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.SuccessResponse'
        "400":
          description: Thiếu organization
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.ErrorResponse'
        "401":
          description: Thiếu token / token không hợp lệ
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Lấy danh sách danh mục (phân trang)
      tags:
      - Categories
    post:
      consumes:
      - application/json
      parameters:
      - description: 'Thông tin danh mục (type: service | product)'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_daidat02_server_internal_domain_category.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Tạo danh mục thành công
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.SuccessResponse'
        "400":
          description: Dữ liệu không hợp lệ / thiếu organization
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.ErrorResponse'
        "401":
          description: Thiếu token / token không hợp lệ
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.ErrorResponse'
        "500":
          description: Lỗi server (vd trùng tên trong org)
          schema:
            $ref: '#/definitions/github_com_daidat02_server_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Tạo danh mục
      tags:
      - Categories
  /categories/{id}:
    delete:
      parameters:
      - description: ID danh mục
